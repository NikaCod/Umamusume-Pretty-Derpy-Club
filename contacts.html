<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Контакты — Uma Club «Финиш»</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;800&family=Unbounded:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main>
<div class="page-title"><div class="wrap"><h1>Контакты</h1></div></div>
<section><div class="wrap"><h2>Напиши нам</h2>
<form id="feedback" novalidate>
<label>Имя<input name="name" autocomplete="name"><span class="err" data-err="name"></span></label>
<label>Email<input name="email" type="email" autocomplete="email"><span class="err" data-err="email"></span></label>
<label>Сообщение<textarea name="message" rows="5"></textarea><span class="err" data-err="message"></span></label>
<button class="btn" type="submit">Отправить сообщение</button></form>
<p class="ok" role="status">Спасибо! Сообщение принято, мы ответим на почту.</p>
<h2 style="margin-top:2.5rem">Где нас найти</h2>
<p>Email: club@example.com<br>Discord: Uma Club «Финиш»</p></div></section>
</main><div id="site-footer"></div><script src="js/main.js"></script></body></html>
